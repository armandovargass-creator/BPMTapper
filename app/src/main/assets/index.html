<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>BPM Tapper</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{padding:20px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:#121212;font-family:system-ui,-apple-system,sans-serif;color:#fff}.header{text-align:center;margin-top:20px}.bpm-display{font-size:80px;font-weight:800;color:#00e676;line-height:1}.bpm-label{font-size:18px;color:#b0bec5;letter-spacing:2px;margin-top:5px}.tap-button{width:260px;height:260px;border-radius:50%;border:none;background:linear-gradient(145deg,#2979ff,#1565c0);color:white;font-size:32px;font-weight:bold;box-shadow:0 10px 25px rgba(41,121,255,.4);cursor:pointer;transition:transform .05s ease,background .2s ease;outline:none;touch-action:manipulation}.tap-button:active{transform:scale(.93);background:linear-gradient(145deg,#1565c0,#0d47a1)}.footer{margin-bottom:20px}.reset-btn{background:transparent;border:1px solid #424242;color:#b0bec5;padding:10px 24px;border-radius:20px;font-size:14px;cursor:pointer}.reset-btn:active{background:#212121}
</style></head>
<body>
<div class="header"><div id="bpm" class="bpm-display">---</div><div class="bpm-label">BPM</div></div>
<button id="tapBtn" class="tap-button">TAP</button>
<div class="footer"><button id="resetBtn" class="reset-btn">Reiniciar</button></div>
<script>
const tapBtn=document.getElementById('tapBtn'),bpmDisplay=document.getElementById('bpm'),resetBtn=document.getElementById('resetBtn');let taps=[];
function tap(){const now=performance.now();if(taps.length&&(now-taps[taps.length-1])>3000)taps=[];taps.push(now);if(taps.length>8)taps.shift();if(taps.length>1){let intervals=[];for(let i=1;i<taps.length;i++)intervals.push(taps[i]-taps[i-1]);const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;const bpm=Math.round(60000/avg);bpmDisplay.textContent=bpm;}else bpmDisplay.textContent='---';}
tapBtn.addEventListener('pointerdown',e=>{e.preventDefault();tap();});resetBtn.addEventListener('click',()=>{taps=[];bpmDisplay.textContent='---';});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap();}if(e.key==='Escape'){taps=[];bpmDisplay.textContent='---';}});
</script></body></html>
